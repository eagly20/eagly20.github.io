<!DOCTYPE html>
<html>
<head>
  <title>File Locker</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: auto; }
    input, button { width: 100%; margin: 10px 0; padding: 10px; }
    img, video { max-width: 100%; }
  </style>
</head>
<body>

<h2>Upload</h2>
<input type="file" id="file">
<input type="password" id="uploadPass" placeholder="Password">
<button onclick="upload()">Upload</button>
<p id="uploadResult"></p>

<hr>

<h2>Access</h2>
<input type="password" id="downloadPass" placeholder="Password">
<button onclick="loadFile()">Unlock File</button>

<div id="fileArea"></div>

<script src="app.js"></script>
</body>
</html>
