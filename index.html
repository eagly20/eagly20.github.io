<!DOCTYPE html>
<html>
<head>
  <title>Cloud Locker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="uploadPage" class="card">
  <h1>Upload</h1>

  <input type="file" id="file">
  <input type="password" id="pass" placeholder="Password">

  <button onclick="upload()">Upload</button>

  <p id="result"></p>
</div>

<div id="filePage" class="card hidden">
  <h1>File Access</h1>

  <input type="password" id="filePass">
  <button onclick="loadFile()">Unlock</button>

  <div id="output"></div>
</div>

<script src="app.js"></script>
</body>
</html>
