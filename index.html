<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Locker Pro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

  <h1>Cloud Locker</h1>
  <p class="subtext">Secure upload + password protected files</p>

  <!-- NAV BUTTONS -->
  <div class="tabs">
    <button onclick="showUpload()">Upload</button>
    <button onclick="showAccess()">Access</button>
  </div>

  <!-- UPLOAD SECTION -->
  <div id="uploadPage">

    <input type="file" id="file">
    <input type="password" id="pass" placeholder="Set Password">

    <button id="uploadBtn" onclick="upload()">Upload File</button>

    <div id="result"></div>

  </div>

  <!-- ACCESS SECTION -->
  <div id="filePage" class="hidden">

    <input type="text" id="codeInput" placeholder="File Code">
    <input type="password" id="filePass" placeholder="Password">

    <button onclick="loadFile()">Unlock File</button>

    <div id="output"></div>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
