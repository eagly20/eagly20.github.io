<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Cloud Locker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="uploadPage" class="card">
  <h1>Cloud Locker</h1>

  <input type="file" id="file">
  <input type="password" id="pass" placeholder="Set Password">

  <button id="uploadBtn" onclick="upload()">Upload File</button>

  <p id="result"></p>
</div>

<div id="filePage" class="card hidden">
  <h1>Access File</h1>

  <input type="text" id="codeInput" placeholder="File Code (optional override)">
  <input type="password" id="filePass" placeholder="Password">

  <button onclick="loadFile()">Unlock</button>

  <div id="output"></div>
</div>

<script src="app.js"></script>
</body>
</html>
