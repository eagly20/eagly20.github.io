<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Locker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- UPLOAD -->
<div id="uploadPage" class="card">

  <h1>Cloud Locker</h1>
  <p class="subtext">Upload file → get secure code</p>

  <input type="file" id="file">
  <input type="password" id="pass" placeholder="Set Password">

  <button id="uploadBtn" onclick="upload()">Upload File</button>

  <div id="result"></div>

</div>

<!-- FILE ACCESS -->
<div id="filePage" class="card hidden">

  <h1>Access File</h1>
  <p class="subtext">Enter code + password</p>

  <input type="text" id="codeInput" placeholder="File Code">
  <input type="password" id="filePass" placeholder="Password">

  <button onclick="loadFile()">Unlock File</button>

  <div id="output"></div>

</div>

<script src="app.js"></script>
</body>
</html>
