<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cloud Locker</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  text-align: center;
  color: white;
  background: linear-gradient(-45deg,#4facfe,#00f2fe,#a18cd1,#fbc2eb);
  background-size: 400% 400%;
  animation: bg 10s linear infinite;
}

@keyframes bg {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.card {
  max-width: 420px;
  margin: 60px auto;
  padding: 20px;
  background: rgba(0,0,0,0.6);
  border-radius: 16px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: none;
  border-radius: 10px;
}

button {
  background: #00c6ff;
  color: white;
  font-weight: bold;
}

.box {
  margin-top: 15px;
  padding: 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
}

img, video {
  width: 100%;
  margin-top: 10px;
  border-radius: 10px;
}
</style>

</head>

<body>

<div class="card">

<h1>Cloud Locker</h1>

<input type="file" id="file">
<input type="password" id="pass" placeholder="Password">

<button onclick="upload()">Upload</button>

<div id="result"></div>

<hr>

<input type="text" id="code" placeholder="File Code">
<input type="password" id="filePass" placeholder="Password">

<button onclick="loadFile()">Open File</button>

<div id="output"></div>

</div>

<script src="app.js"></script>
</body>
</html>
