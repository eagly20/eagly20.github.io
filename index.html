<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure File Locker</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

  <div class="background"></div>

  <!-- UPLOAD PAGE -->
  <div id="uploadPage" class="card">
    <h1>File Locker</h1>

    <input type="file" id="file" />
    <input type="password" id="upPass" placeholder="Set Password" />

    <button id="uploadBtn" onclick="upload()">Upload File</button>

    <p id="upResult"></p>
  </div>

  <!-- FILE ACCESS PAGE -->
  <div id="filePage" class="card hidden">
    <h1>Unlock File</h1>

    <input type="password" id="downPass" placeholder="Enter Password" />
    <button onclick="loadFile()">Unlock</button>

    <div id="output"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
